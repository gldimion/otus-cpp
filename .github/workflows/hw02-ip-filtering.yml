name: 'HW02 - IP Filtering'

on:
  push:
    branches:
      - master
    paths:
      - 'hw02-ip-filtering/**'
      - '.github/workflows/hw02-ip-filtering.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HW_DIR: hw02-ip-filtering
      TAG_PREFIX: hw02
      PACKAGE_FILE: ip_filter-0.0.${{ github.run_number }}-Linux.deb
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install libboost-test-dev -y
      - run: cmake -S "$HW_DIR" -B "$HW_DIR/build" -DPATCH_VERSION=${{ github.run_number }} -DWITH_BOOST_TEST=ON
      - run: cmake --build "$HW_DIR/build"
      - run: ctest --test-dir "$HW_DIR/build" --output-on-failure
      - run: cmake --build "$HW_DIR/build" --target package
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_PREFIX }}-v${{ github.run_number }}
          release_name: '${{ github.workflow }} #${{ github.run_number }}'
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./${{ env.HW_DIR }}/build/${{ env.PACKAGE_FILE }}
          asset_name: ${{ env.PACKAGE_FILE }}
          asset_content_type: application/vnd.debian.binary-package
